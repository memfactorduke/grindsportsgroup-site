name: Update partnership images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update partnership cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = {
              '<div class="partner-item"><span class="partner-name">Stand+</span></div>': '<div class="partner-item"><img src="images/12a682ef85fddf97cda6032c110e8b1c3759ddde-2499x2499.jpg.webp" alt="Stand+"></div>',
              '<div class="partner-item"><span class="partner-name">Dig Inn</span></div>': '<div class="partner-item"><img src="images/dig-inn-default-meta-image.png" alt="Dig Inn"></div>',
              '<div class="partner-item"><span class="partner-name">Fit King</span></div>': '<div class="partner-item"><img src="images/FITKINGAirCompressionRecoverySystem_FullKit.jpg.webp" alt="Fit King"></div>',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use partnership covers for Stand+, Dig Inn, and Fit King"
          git push
